<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Jellyfin Shorts</title>
  <link rel="stylesheet" href="/Shorts/web/shorts.css?v=20261112_02">
</head>
<body>
  <div id="shorts-container">
    <!-- Top Navigation -->
    <header class="top-bar chrome-element">
      <button id="btn-close" class="icon-btn" title="退出">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <div id="top-title" class="top-title">Shorts</div>
      <div style="display:flex;gap:8px;">
        <button id="btn-random" class="icon-btn" title="播放模式">
          <span id="random-icon-wrapper" class="icon-wrapper"></span>
        </button>
        <button id="btn-autonext" class="icon-btn" title="连播模式">
          <span id="autonext-icon-wrapper" class="icon-wrapper"></span>
        </button>
        <button id="btn-mute" class="icon-btn" title="静音开关"></button>
      </div>
    </header>

    <!-- Center Play/Pause Indicator -->
    <div id="center-indicator" class="center-indicator"></div>

    <!-- Spinner -->
    <div id="spinner" class="spinner-container">
      <div class="spinner"></div>
    </div>

    <!-- Empty Notice -->
    <div id="empty-message" class="feed-message"></div>

    <!-- Feed Viewport -->
    <main id="viewport" class="feed-viewport">
      <section id="card-prev" class="video-card" style="transform: translateY(-100%);">
        <video playsinline loop muted preload="none"></video>
      </section>
      <section id="card-current" class="video-card" style="transform: translateY(0);">
        <video playsinline loop muted autoplay></video>
      </section>
      <section id="card-next" class="video-card" style="transform: translateY(100%);">
        <video playsinline loop muted preload="none"></video>
      </section>
    </main>

    <!-- Side Actions -->
    <aside class="side-actions chrome-element">
      <div class="action-item" id="btn-like">
        <div class="action-btn">
          <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
        <span class="action-label" id="like-label">喜欢</span>
      </div>

      <div class="action-item" id="btn-fit">
        <div class="action-btn">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </div>
        <span class="action-label">比例</span>
      </div>

      <div class="action-item" id="btn-quality">
        <div class="action-btn">
          <svg viewBox="0 0 24 24"><path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 11H9.5v-2h-2v2H6V9h1.5v2.5h2V9H11v6zm7-1c0 .55-.45 1-1 1h-4V9h4c.55 0 1 .45 1 1v4zm-1.5-3.5h-2v3h2v-3z"/></svg>
        </div>
        <span class="action-label" id="quality-label">原画</span>
      </div>
    </aside>

    <!-- Bottom Overlay Meta & Progress -->
    <footer class="bottom-overlay">
      <div id="meta-text-wrapper" class="chrome-element">
        <div id="info-title" class="video-info-title"></div>
        <div id="info-tags" class="video-meta-tags"></div>
      </div>

      <div id="progress-container" class="progress-container">
        <div class="progress-track">
          <div id="progress-buffered" class="progress-buffered"></div>
          <div id="progress-fill" class="progress-fill"></div>
          <div id="progress-thumb" class="progress-thumb"></div>
        </div>
      </div>
    </footer>

    <!-- Quality Selector Bottom Sheet Modal -->
    <div id="quality-modal" class="modal-backdrop">
      <div class="quality-sheet">
        <div class="sheet-header">
          <span class="sheet-title">画质与码率选择</span>
          <button id="btn-close-quality" class="icon-btn-text">✕</button>
        </div>
        <div class="quality-options" id="quality-options"></div>
      </div>
    </div>
  </div>

  <script src="/Shorts/web/shorts.js?v=20261112_02"></script>
</body>
</html>
