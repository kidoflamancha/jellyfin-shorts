<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Jellyfin Shorts 配置</title>
</head>
<body>
  <div id="ShortsConfigurationPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
      <div class="content-primary">
        <h1>Jellyfin Shorts 短视频插件配置</h1>
        <p>提供类似抖音的垂直流短视频播放体验，可直接在 Web 界面或独立 App 模式下使用。</p>

        <form id="shortsConfigForm">
          <div class="checkboxContainer checkboxContainer-withDescription">
            <label>
              <input id="chkRecursive" is="emby-checkbox" type="checkbox" />
              <span>递归搜索子文件夹</span>
            </label>
            <div class="fieldDescription">在指定目录下方递归检索所有子目录中的短视频。</div>
          </div>

          <div class="checkboxContainer checkboxContainer-withDescription">
            <label>
              <input id="chkRandom" is="emby-checkbox" type="checkbox" />
              <span>默认启用随机信息流</span>
            </label>
            <div class="fieldDescription">开启后，每次进入默认随机打乱视频顺序；关闭则按文件名或入库时间顺序排列。</div>
          </div>

          <div class="checkboxContainer checkboxContainer-withDescription">
            <label>
              <input id="chkAutoAdvance" is="emby-checkbox" type="checkbox" />
              <span>默认开启自动连播</span>
            </label>
            <div class="fieldDescription">开启后，单个视频播放完毕后自动切换到下一个视频；关闭则单视频循环重播。</div>
          </div>

          <div class="inputContainer">
            <label class="inputLabel inputLabelUnfocused" for="txtDefaultLimit">单次加载视频数量</label>
            <input id="txtDefaultLimit" is="emby-input" type="number" min="5" max="100" />
            <div class="fieldDescription">默认每次从服务端分页拉取的视频数量（推荐 20 ~ 30）。</div>
          </div>

          <div class="inputContainer">
            <label class="inputLabel inputLabelUnfocused" for="txtMaxDuration">最大视频时长限制（分钟）</label>
            <input id="txtMaxDuration" is="emby-input" type="number" min="0" max="120" />
            <div class="fieldDescription">过滤超过此时长的长视频（设为 0 表示不限制时长）。</div>
          </div>

          <div style="margin-top: 24px;">
            <button is="emby-button" type="submit" class="raised button-submit block emby-button">
              <span>保存配置</span>
            </button>
          </div>
        </form>

        <div style="margin-top: 36px; padding: 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;">
          <h3>快捷访问链接</h3>
          <p>
            <a href="/Shorts/app" target="_blank" style="color: #00a4dc; font-weight: bold; text-decoration: underline;">
              打开独立 Shorts 播放器页面 ↗
            </a>
          </p>
        </div>
      </div>
    </div>

    <script type="text/javascript">
      var ShortsConfigurationPage = {
        pluginId: "5f8f478c-3b27-48b9-b2ed-d56d629b4d2d",

        loadConfiguration: function (page) {
          Dashboard.showLoadingMsg();
          ApiClient.getJSON(ApiClient.getUrl("Shorts/Configuration")).then(function (config) {
            page.querySelector('#chkRecursive').checked = config.Recursive !== false;
            page.querySelector('#chkRandom').checked = config.EnableRandomFeedByDefault !== false;
            page.querySelector('#chkAutoAdvance').checked = config.AutoAdvance === true;
            page.querySelector('#txtDefaultLimit').value = config.DefaultLimit || 30;
            page.querySelector('#txtMaxDuration').value = config.MaxDurationMinutes !== undefined ? config.MaxDurationMinutes : 15;
            Dashboard.hideLoadingMsg();
          }).catch(function (err) {
            Dashboard.hideLoadingMsg();
            Dashboard.alert("获取配置失败: " + err);
          });
        },

        saveConfiguration: function (page) {
          Dashboard.showLoadingMsg();
          var config = {
            Recursive: page.querySelector('#chkRecursive').checked,
            EnableRandomFeedByDefault: page.querySelector('#chkRandom').checked,
            AutoAdvance: page.querySelector('#chkAutoAdvance').checked,
            DefaultLimit: parseInt(page.querySelector('#txtDefaultLimit').value, 10) || 30,
            MaxDurationMinutes: parseInt(page.querySelector('#txtMaxDuration').value, 10) || 0
          };

          ApiClient.ajax({
            type: "POST",
            url: ApiClient.getUrl("Shorts/Configuration"),
            data: JSON.stringify(config),
            contentType: "application/json"
          }).then(function () {
            Dashboard.hideLoadingMsg();
            Dashboard.alert("配置保存成功！");
          }).catch(function (err) {
            Dashboard.hideLoadingMsg();
            Dashboard.alert("保存失败: " + err);
          });
        }
      };

      document.getElementById('ShortsConfigurationPage').addEventListener('pageshow', function () {
        ShortsConfigurationPage.loadConfiguration(this);
      });

      document.getElementById('shortsConfigForm').addEventListener('submit', function (e) {
        e.preventDefault();
        ShortsConfigurationPage.saveConfiguration(document.getElementById('ShortsConfigurationPage'));
        return false;
      });
    </script>
  </div>
</body>
</html>
